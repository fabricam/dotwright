name: .NET Tests

on:
  push:
    branches: [ main, squad/add-playwright-reader-tests ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
      - name: Pack Dotwright.Playwright Library
        run: dotnet pack src/Dotwright.Playwright/Dotwright.Playwright.csproj -c Release --no-build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/fabricam/index.json"
          dotnet nuget push "src/Dotwright.Playwright/bin/Release/*.nupkg" --source github --skip-duplicate
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

